
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/script.js" defer></script>
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <div class="logo">UI</div>
    <button class="nav active" data-view="tasks">⌂</button>
    <button class="nav" data-view="analytics">▥</button>
    <button class="nav" data-view="calendar">▦</button>
    <button class="nav" data-view="inbox">✉</button>
    <div class="bottom-nav">
      <button id="theme">☾</button>
      <button id="settings">⚙</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <input id="search" type="search" placeholder="⌕  Search tasks...">
      <button id="notifications">♧</button>
      <div class="avatar">Y</div>
    </header>

    <section id="tasks-view">
      <div class="heading">
        <div>
          <small>WORKSPACE / TASKS</small>
          <h1>My Tasks</h1>
          <p>Keep your work organized and moving forward.</p>
        </div>
        <button class="primary" id="create">＋ Create New Task</button>
      </div>

      <div class="tabs">
        <button data-category="Assigned">Assigned Tasks <span id="count-assigned">0</span></button>
        <button class="selected" data-category="Accepted">Accepted Tasks <span id="count-accepted">0</span></button>
        <button data-category="Review">Review Tasks <span id="count-review">0</span></button>
      </div>

      <div class="filters">
        <input id="filter-date" type="date" title="Filter by due date">
        <select id="filter-status">
          <option value="">Choose Status</option>
          <option>Pending</option>
          <option>In progress</option>
          <option>Completed</option>
        </select>
        <select id="filter-priority">
          <option value="">Choose Priority</option>
          <option>High</option><option>Medium</option><option>Low</option>
        </select>
        <button class="filter-btn" id="apply">Filter</button>
        <button class="clear-btn" id="clear">Clear</button>
      </div>

      <div class="stats">
        <div class="stat"><span>▤</span><p>Total tasks<strong id="total">0</strong></p></div>
        <div class="stat"><span>◷</span><p>In progress<strong id="progress">0</strong></p></div>
        <div class="stat"><span>✓</span><p>Completed<strong id="completed">0</strong></p></div>
        <div class="stat"><span>!</span><p>Overdue<strong id="overdue">0</strong></p></div>
      </div>

      <div class="table-card">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>TITLE</th><th>PRIORITY</th><th>STATUS</th>
                <th>CREATED BY</th><th>DATE ASSIGNED</th>
                <th>DUE DATE</th><th>ACTIONS</th>
              </tr>
            </thead>
            <tbody id="task-list"></tbody>
          </table>
        </div>
        <div class="pagination">
          <label>Rows per page:
            <select id="page-size">
              <option>5</option><option selected>10</option>
              <option>20</option><option>50</option>
            </select>
          </label>
          <span id="page-info">0–0 of 0</span>
          <button id="previous">‹</button>
          <button id="next">›</button>
        </div>
      </div>
    </section>

    <section id="other-view" hidden>
      <h1 id="other-title">Analytics</h1>
      <p id="other-description"></p>
      <div id="other-content"></div>
    </section>
  </main>
</div>

<div class="modal-overlay" id="modal" hidden>
  <form id="task-form" class="modal">
    <button type="button" id="close" class="close">×</button>
    <h2 id="modal-heading">Create New Task</h2>

    <label>Task title *
      <input id="title" required maxlength="160" placeholder="Enter task title">
    </label>
    <label>Description
      <textarea id="description" placeholder="Enter task details"></textarea>
    </label>

    <div class="form-row">
      <label>Priority
        <select id="priority">
          <option>Low</option><option selected>Medium</option><option>High</option>
        </select>
      </label>
      <label>Status
        <select id="status">
          <option>Pending</option><option>In progress</option><option>Completed</option>
        </select>
      </label>
    </div>

    <div class="form-row">
      <label>Due date <input type="date" id="deadline"></label>
      <label>Category
        <select id="category">
          <option>Assigned</option><option>Accepted</option><option>Review</option>
        </select>
      </label>
    </div>

    <label>Created by
      <input id="creator" value="You">
    </label>
    <p id="error" class="error"></p>
    <div class="modal-actions">
      <button type="button" id="cancel">Cancel</button>
      <button type="submit" class="primary" id="save">Create Task</button>
    </div>
  </form>
</div>

<div id="toast" class="toast"></div>
</body>
</html>
